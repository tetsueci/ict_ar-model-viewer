<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D モデル AR ビューア</title>
<meta name="description" content="スマートフォンで 3D モデルを AR 表示します">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4/dist/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2330; --muted: #5f6878;
    --line: #dde1e7; --accent: #1a6fd6; --accent-text: #ffffff; --viewer: #e9ecf0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1d2128; --text: #e6e9ee; --muted: #9aa3b2;
      --line: #2e343d; --accent: #4b93ee; --accent-text: #0b0e12; --viewer: #232830;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  main { flex: 1; display: flex; min-height: 0; }
  nav {
    width: 260px; flex: none; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--line); padding: 8px;
  }
  nav button {
    display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 0 0 4px;
    border: 1px solid transparent; border-radius: 8px; background: none; color: var(--text);
    font: inherit; font-size: 14px; cursor: pointer;
  }
  nav button:hover { background: var(--bg); }
  nav button[aria-current="true"] { border-color: var(--accent); background: var(--bg); }
  nav small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .stage { flex: 1; position: relative; min-width: 0; }
  model-viewer { width: 100%; height: 100%; background: var(--viewer); --poster-color: transparent; }
  .ar-btn {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    padding: 12px 22px; border: 0; border-radius: 999px; background: var(--accent);
    color: var(--accent-text); font: inherit; font-size: 15px; font-weight: 600;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); cursor: pointer;
  }
  .qr {
    position: absolute; right: 16px; bottom: 16px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 176px;
    font-size: 12px; text-align: center; display: none;
  }
  .qr svg { width: 150px; height: 150px; display: block; margin: 0 auto 6px; background: #fff; border-radius: 4px; }
  .msg {
    position: absolute; left: 16px; right: 16px; top: 12px; margin: 0 auto; max-width: 520px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; display: none;
  }
  .progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform .2s; }
  .info { position: absolute; left: 16px; top: 12px; font-size: 12px; color: var(--muted); }
  @media (max-width: 720px) {
    main { flex-direction: column; }
    nav { width: auto; border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; }
    nav button { flex: none; width: auto; margin: 0; white-space: nowrap; }
    nav small { display: none; }
    nav.single { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">3D モデル AR ビューア</h1>
  <p id="desc">読み込み中…</p>
</header>
<main>
  <nav id="list" aria-label="モデル一覧"></nav>
  <div class="stage">
    <model-viewer id="mv"
      ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor"
      camera-controls touch-action="pan-y" shadow-intensity="1" exposure="1"
      environment-image="neutral" interaction-prompt="auto" alt="3D モデル">
      <div class="progress" slot="progress-bar" id="bar"></div>
      <button class="ar-btn" slot="ar-button">AR で置く</button>
    </model-viewer>
    <div class="info" id="size"></div>
    <div class="msg" id="msg"></div>
    <div class="qr" id="qr"><div id="qrimg"></div>スマホで読み取ると<br>AR で表示できます</div>
  </div>
</main>
<script>
(async () => {
  const mv = document.getElementById('mv');
  const $ = id => document.getElementById(id);
  const msg = t => { $('msg').textContent = t; $('msg').style.display = t ? 'block' : 'none'; };

  let models = [];
  try {
    const r = await fetch('models.json', { cache: 'no-cache' });
    models = await r.json();
  } catch (e) {
    $('desc').textContent = '';
    msg('models.json を読めませんでした。ファイルを直接開いた場合は README の「手元で確かめる」を見てください。');
    return;
  }

  const nav = $('list');
  if (models.length <= 1) nav.classList.add('single');
  models.forEach(m => {
    const b = document.createElement('button');
    b.dataset.id = m.id;
    b.innerHTML = `${esc(m.title)}${m.description ? `<small>${esc(m.description)}</small>` : ''}`;
    b.onclick = () => show(m.id, true);
    nav.appendChild(b);
  });

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function show(id, push) {
    const m = models.find(x => x.id === id) || models[0];
    if (!m) { msg('models.json にモデルがありません'); return; }
    msg('');
    $('size').textContent = '';
    $('title').textContent = m.title;
    $('desc').textContent = m.description || '';
    document.title = `${m.title} | AR`;
    mv.alt = m.title;
    mv.setAttribute('ar-scale', m.arScale === 'auto' ? 'auto' : 'fixed');
    if (m.usdz) mv.setAttribute('ios-src', m.usdz); else mv.removeAttribute('ios-src');
    if (m.poster) mv.setAttribute('poster', m.poster); else mv.removeAttribute('poster');
    if (m.cameraOrbit) mv.setAttribute('camera-orbit', m.cameraOrbit); else mv.removeAttribute('camera-orbit');
    mv.src = m.src;
    nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.id === m.id));
    const url = new URL(location.href);
    url.searchParams.set('m', m.id);
    if (push) history.replaceState(null, '', url);
    drawQR(url.href);
  }

  function drawQR(href) {
    if (typeof qrcode === 'undefined') return;
    const q = qrcode(0, 'M'); q.addData(href); q.make();
    $('qrimg').innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  }

  mv.addEventListener('progress', e => {
    const p = e.detail.totalProgress;
    $('bar').style.transform = `scaleX(${p})`;
    $('bar').style.opacity = p >= 1 ? 0 : 1;
  });
  mv.addEventListener('load', () => {
    const d = mv.getDimensions();
    $('size').textContent = `幅 ${d.x.toFixed(2)} m × 高さ ${d.y.toFixed(2)} m × 奥行 ${d.z.toFixed(2)} m`;
  });
  mv.addEventListener('error', () => msg('モデルを読めませんでした（パスか GLB の中身を確かめてください）'));
  mv.addEventListener('ar-status', e => {
    if (e.detail.status === 'failed') msg('AR を開始できませんでした。床を映しながら端末をゆっくり動かしてください。');
  });

  // AR が使えない端末（PC など）では QR を出す
  await customElements.whenDefined('model-viewer');
  const updateQR = () => { $('qr').style.display = mv.canActivateAR ? 'none' : 'block'; };
  mv.addEventListener('load', updateQR);

  show(new URLSearchParams(location.search).get('m'), false);
})();
</script>
</body>
</html>
